name: Import exact mess management project

on:
  push:
    branches: [DSA]

permissions:
  contents: write

jobs:
  import-project:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace project with exact ZIP contents
        run: |
          rm -rf mess-management
          mkdir -p mess-management
          unzip -q mess-management.zip -d /tmp/mess-source
          cp -R "/tmp/mess-source/Mess management/." mess-management/
          rm -f mess-management/mess-tracker/.env
          rm -f mess-management.zip

      - name: Commit exact project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add exact mess management project and remove ZIP"
          git push